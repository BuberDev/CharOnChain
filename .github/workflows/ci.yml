name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Wersja pnpm pochodzi z pola "packageManager" w package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # Na etapie COC-001 nie ma jeszcze źródeł Solidity; testy, fuzz i invariants dochodzą w COC-010..015.
      # UWAGA: ta konfiguracja nie została uruchomiona lokalnie (Foundry niedostępne w sesji COC-001).
      - run: forge --version
        working-directory: packages/contracts
      - run: forge fmt --check
        working-directory: packages/contracts
      - run: forge build
        working-directory: packages/contracts
