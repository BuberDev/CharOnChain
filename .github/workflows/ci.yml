name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Wersja pnpm pochodzi z pola "packageManager" w package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E frontendu (Playwright, wersja podglądowa; axe WCAG 2.2 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @charonchain/web build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: apps/web/e2e/.results
          retention-days: 7

  database:
    name: Database (migracje, rollback, domeny; prawdziwy Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          # Jednorazowa baza w kontenerze CI — to nie jest sekret produkcyjny.
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only-throwaway@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db
      # Smoke skompilowanego CLI na bazie CI. UWAGA: job nie był uruchomiony lokalnie na GitHubie;
      # te same kroki wykonano ręcznie na lokalnym Postgresie 16 (patrz IMPLEMENTATION_PROGRESS.md).
      - run: pnpm --filter @charonchain/database run build
      - run: node packages/database/dist/cli.js up
        env:
          APP_ENV: local
          DATABASE_URL: postgres://postgres:ci-only-throwaway@localhost:5432/postgres
      - run: node packages/database/dist/cli.js status
        env:
          APP_ENV: local
          DATABASE_URL: postgres://postgres:ci-only-throwaway@localhost:5432/postgres

  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # Na etapie COC-001 nie ma jeszcze źródeł Solidity; testy, fuzz i invariants dochodzą w COC-010..015.
      # UWAGA: ta konfiguracja nie została uruchomiona lokalnie (Foundry niedostępne w sesji COC-001).
      - run: forge --version
        working-directory: packages/contracts
      - run: forge fmt --check
        working-directory: packages/contracts
      - run: forge build
        working-directory: packages/contracts
